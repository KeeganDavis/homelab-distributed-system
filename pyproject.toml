[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drl-backend"
version = "0.1.0"
description = "Distributed Reliability Lab backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["app/src"]

[tool.pytest.ini_options]
pythonpath = ["app/src"]
testpaths = ["app/tests"]
